<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 760" font-family="'PingFang SC','Microsoft YaHei',sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#475569"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="680" height="760" fill="#ffffff"/>
  <text x="340" y="30" text-anchor="middle" font-size="20" font-weight="bold" fill="#1f2937">「do you eat」后端分层示意图（Day 19 重构后）</text>

  <!-- 浏览器 -->
  <rect x="170" y="50" width="340" height="52" rx="8" fill="#EEF2FF" stroke="#6366F1" stroke-width="1.5"/>
  <text x="340" y="72" text-anchor="middle" font-size="14" font-weight="bold" fill="#3730A3">浏览器（React 前端）</text>
  <text x="340" y="92" text-anchor="middle" font-size="12" fill="#4B5563">localStorage 评分 · 收藏操作 · 前端生成用户 UUID</text>

  <line x1="340" y1="102" x2="340" y2="140" stroke="#475569" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="352" y="126" font-size="12" fill="#6B7280">HTTPS · X-User-Id 请求头</text>

  <!-- CloudBase 边界 -->
  <rect x="24" y="142" width="632" height="570" rx="10" fill="#F0FDF9" stroke="#10B981" stroke-width="1.5" stroke-dasharray="6 4"/>
  <text x="340" y="166" text-anchor="middle" font-size="13" font-weight="bold" fill="#047857">腾讯云 CloudBase（环境 doyoueat-d5g36rg7ia785b553）</text>

  <!-- 网关 -->
  <rect x="88" y="176" width="504" height="44" rx="8" fill="#FFF7ED" stroke="#F59E0B" stroke-width="1.5"/>
  <text x="340" y="203" text-anchor="middle" font-size="13" font-weight="bold" fill="#9A3412">HTTP 网关　/api/health · /api/foods · /api/favorites</text>

  <line x1="340" y1="220" x2="340" y2="256" stroke="#475569" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- 接口层 -->
  <rect x="40" y="258" width="600" height="124" rx="8" fill="#EFF6FF" stroke="#3B82F6" stroke-width="1.5"/>
  <text x="52" y="280" font-size="14" font-weight="bold" fill="#1D4ED8">接口层　functions/*/index.js</text>
  <text x="628" y="280" text-anchor="end" font-size="12" fill="#4B5563">只做：接请求 → 校验 → 调 repository → 返响应</text>
  <rect x="56" y="292" width="176" height="44" rx="6" fill="#ffffff" stroke="#93C5FD" stroke-width="1.2"/>
  <text x="144" y="312" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#1E40AF">health/index.js</text>
  <text x="144" y="328" text-anchor="middle" font-size="11" fill="#6B7280">不连数据库</text>
  <rect x="248" y="292" width="180" height="44" rx="6" fill="#ffffff" stroke="#93C5FD" stroke-width="1.2"/>
  <text x="338" y="312" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#1E40AF">foods/index.js</text>
  <text x="338" y="328" text-anchor="middle" font-size="11" fill="#6B7280">GET #1 · POST #2</text>
  <rect x="444" y="292" width="180" height="44" rx="6" fill="#ffffff" stroke="#93C5FD" stroke-width="1.2"/>
  <text x="534" y="312" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#1E40AF">favorites/index.js</text>
  <text x="534" y="328" text-anchor="middle" font-size="11" fill="#6B7280">GET #7 · POST #8</text>
  <text x="52" y="366" font-size="12" fill="#4B5563">状态码、中文报错、幂等约定（重复收藏 201、同名 409）都住在这层</text>

  <line x1="340" y1="382" x2="340" y2="420" stroke="#475569" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="352" y="404" font-size="12" fill="#6B7280">调函数拿数据 / 失败抛 RepoError（状态码+错误码+文案）</text>

  <!-- 数据访问层 -->
  <rect x="40" y="422" width="600" height="110" rx="8" fill="#FDF2F8" stroke="#EC4899" stroke-width="1.5"/>
  <text x="52" y="444" font-size="14" font-weight="bold" fill="#BE185D">数据访问层　functions/*/xxxRepository.js</text>
  <text x="628" y="444" text-anchor="end" font-size="12" fill="#4B5563">只做：拼 PostgREST 查询 / 报数据库事实</text>
  <rect x="56" y="456" width="272" height="44" rx="6" fill="#ffffff" stroke="#F9A8D4" stroke-width="1.2"/>
  <text x="192" y="476" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#9D174D">foodsRepository.js</text>
  <text x="192" y="492" text-anchor="middle" font-size="11" fill="#6B7280">查全部 · 同名查重 · 插入（撞 id 自动换号）</text>
  <rect x="352" y="456" width="272" height="44" rx="6" fill="#ffffff" stroke="#F9A8D4" stroke-width="1.2"/>
  <text x="488" y="476" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#9D174D">favoritesRepository.js</text>
  <text x="488" y="492" text-anchor="middle" font-size="11" fill="#6B7280">按用户查 · 已收藏查 · foods 外键预查 · 插入</text>
  <text x="52" y="522" font-size="12" fill="#4B5563">对应前端纪律：storage.ts 是评分唯一出口，repository 是数据库唯一出口</text>

  <line x1="340" y1="532" x2="340" y2="568" stroke="#475569" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="352" y="554" font-size="12" fill="#6B7280">REST + Bearer API Key（只存函数环境变量）</text>

  <!-- PostgREST -->
  <rect x="120" y="570" width="440" height="40" rx="8" fill="#F8FAFC" stroke="#64748B" stroke-width="1.5"/>
  <text x="340" y="595" text-anchor="middle" font-size="13" font-weight="bold" fill="#334155">PostgREST（CloudBase PG REST API）</text>

  <line x1="340" y1="610" x2="340" y2="638" stroke="#475569" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- 数据库 -->
  <rect x="120" y="640" width="440" height="58" rx="8" fill="#F0FDF4" stroke="#16A34A" stroke-width="1.5"/>
  <text x="340" y="663" text-anchor="middle" font-size="13" font-weight="bold" fill="#166534">CloudBase PostgreSQL</text>
  <text x="340" y="685" text-anchor="middle" font-size="12" fill="#15803D">foods · favorites · ratings · health_profiles</text>

  <text x="340" y="742" text-anchor="middle" font-size="11" fill="#9CA3AF">Day 19 · 2026-10-07 · 分层重构后全接口回归 9/9 通过</text>
</svg>
